<style>
  /* ust-tam-ekran — Menü bir sahne geçişi: tüm ekranı kaplayan cesur tipografi (ajans/portföy dili); masaüstünde de aynı deneyim. */
  .modulex-ust-tam-ekran { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-tam-ekran *, .modulex-ust-tam-ekran *::before, .modulex-ust-tam-ekran *::after { box-sizing: border-box; }

  .modulex-ust-tam-ekran :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-tam-ekran :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-tam-ekran :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-tam-ekran :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-tam-ekran img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-tam-ekran) img { height: auto; }
  .modulex-ust-tam-ekran [hidden] { display: none !important; }
  .modulex-ust-tam-ekran :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-tam-ekran :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-tam-ekran-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-tam-ekran-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }

  .modulex-ust-tam-ekran-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-tam-ekran-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-tam-ekran-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-tam-ekran-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-tam-ekran-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }

  .modulex-ust-tam-ekran { position: relative; z-index: 900; }
  .modulex-ust-tam-ekran-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-tam-ekran-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-tam-ekran-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-tam-ekran-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-tam-ekran-oge:hover, .modulex-ust-tam-ekran-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-tam-ekran-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-tam-ekran-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-tam-ekran-cta .material-symbols-outlined, .modulex-ust-tam-ekran-tel .material-symbols-outlined, .modulex-ust-tam-ekran-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-tam-ekran-tel, .modulex-ust-tam-ekran-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-tam-ekran-tel:hover, .modulex-ust-tam-ekran-posta:hover { color: --accentInk--; }
  .modulex-ust-tam-ekran-dil:empty { display: none; }
  .modulex-ust-tam-ekran-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-tam-ekran-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-tam-ekran-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-tam-ekran--acik .modulex-ust-tam-ekran-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-tam-ekran--acik .modulex-ust-tam-ekran-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-tam-ekran--acik .modulex-ust-tam-ekran-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-tam-ekran-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-tam-ekran-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-tam-ekran-sol 0.3s ease both; }
  @keyframes modulex-ust-tam-ekran-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-tam-ekran-cubuk { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
  .modulex-ust-tam-ekran-son { display: flex; align-items: center; gap: 14px; }
  .modulex-ust-tam-ekran--js .modulex-ust-tam-ekran-ac { display: inline-flex; }
  .modulex-ust-tam-ekran--js .modulex-ust-tam-ekran-nav--yedek { display: none; }
  .modulex-ust-tam-ekran-liste { display: flex; flex-wrap: wrap; gap: 4px 24px; padding-block-end: 10px; }
  .modulex-ust-tam-ekran-panel { position: fixed; inset: 0; z-index: 2; display: grid; grid-template-rows: auto 1fr auto; gap: 20px; padding: 18px clamp(20px, 5vw, 64px) 32px; overflow-y: auto; background: --vurguBg--; color: --vurguText--; animation: modulex-ust-tam-ekran-ac 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes modulex-ust-tam-ekran-ac { from { clip-path: circle(0% at 100% 0); } to { clip-path: circle(150% at 100% 0); } }
  .modulex-ust-tam-ekran-ptepe { display: flex; align-items: center; justify-content: space-between; }
  .modulex-ust-tam-ekran-panel .modulex-ust-tam-ekran-kapat { border-color: currentColor; }
  .modulex-ust-tam-ekran-pnav { display: grid; align-content: center; }
  .modulex-ust-tam-ekran-pliste { display: grid; gap: 2px; counter-reset: modulex-ust-tam-ekran-s; }
  .modulex-ust-tam-ekran-pliste li { animation: modulex-ust-tam-ekran-gel 0.5s ease both; }
  .modulex-ust-tam-ekran-pliste li:nth-child(2) { animation-delay: 0.05s; }
  .modulex-ust-tam-ekran-pliste li:nth-child(3) { animation-delay: 0.1s; }
  .modulex-ust-tam-ekran-pliste li:nth-child(4) { animation-delay: 0.15s; }
  .modulex-ust-tam-ekran-pliste li:nth-child(n + 5) { animation-delay: 0.2s; }
  @keyframes modulex-ust-tam-ekran-gel { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .modulex-ust-tam-ekran-poge { display: inline-flex; align-items: baseline; gap: 18px; color: inherit; font-family: var(--mx-font-heading, inherit); font-size: clamp(2.2rem, 7vw, 5.4rem); font-weight: 900; letter-spacing: -0.04em; line-height: 1.08; text-decoration: none; transition: letter-spacing 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-tam-ekran-poge::before { counter-increment: modulex-ust-tam-ekran-s; content: counter(modulex-ust-tam-ekran-s, decimal-leading-zero); font-size: 0.95rem; font-weight: 700; letter-spacing: 0; }
  .modulex-ust-tam-ekran-pliste:hover .modulex-ust-tam-ekran-poge { opacity: 0.55; }
  .modulex-ust-tam-ekran-pliste .modulex-ust-tam-ekran-poge:hover, .modulex-ust-tam-ekran-poge[aria-current="page"] { opacity: 1; letter-spacing: -0.02em; }
  .modulex-ust-tam-ekran-palt { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; }
  .modulex-ust-tam-ekran-panel .modulex-ust-tam-ekran-cta { background: --vurguText--; color: --vurguBg--; }
  .modulex-ust-tam-ekran-panel :is(.modulex-ust-tam-ekran-tel, .modulex-ust-tam-ekran-posta):hover { color: inherit; text-decoration: underline; }
  .modulex-ust-tam-ekran-pdil { display: none; }
  .modulex-ust-tam-ekran-son { flex: none; }
  @media (max-width: 768px) {
    .modulex-ust-tam-ekran-ac-yazi { display: none; }
  }
  @media (max-width: 600px) {
    .modulex-ust-tam-ekran--js .modulex-ust-tam-ekran-son .modulex-ust-tam-ekran-dil { display: none; }
    .modulex-ust-tam-ekran--js .modulex-ust-tam-ekran-pdil { display: block; }
    .modulex-ust-tam-ekran:not(.modulex-ust-tam-ekran--js) .modulex-ust-tam-ekran-cubuk { flex-wrap: wrap; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-tam-ekran :is(.modulex-ust-tam-ekran-baslik, .modulex-ust-tam-ekran-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-tam-ekran-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-tam-ekran { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-tam-ekran *, .modulex-ust-tam-ekran *::before, .modulex-ust-tam-ekran *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-tam-ekran";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
