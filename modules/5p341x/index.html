<style>
  /* ozellik-sekme-gorsel — Özellikler aynı anda değil tek tek, büyük görselle anlatılır (sekmeli vitrin); ekran görüntülü ürün özellikleri için. */
  .modulex-ozellik-sekme-gorsel { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ozellik-sekme-gorsel *, .modulex-ozellik-sekme-gorsel *::before, .modulex-ozellik-sekme-gorsel *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ozellik-sekme-gorsel :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ozellik-sekme-gorsel :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ozellik-sekme-gorsel :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ozellik-sekme-gorsel :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ozellik-sekme-gorsel img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ozellik-sekme-gorsel) img { height: auto; }
  .modulex-ozellik-sekme-gorsel [hidden] { display: none !important; }
  .modulex-ozellik-sekme-gorsel :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ozellik-sekme-gorsel :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ozellik-sekme-gorsel-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ozellik-sekme-gorsel-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ozellik-sekme-gorsel--bassiz .modulex-ozellik-sekme-gorsel-bas { display: none; }
  .modulex-ozellik-sekme-gorsel-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ozellik-sekme-gorsel-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ozellik-sekme-gorsel-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ozellik-sekme-gorsel-bas { max-width: 760px; }
  .modulex-ozellik-sekme-gorsel-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ozellik-sekme-gorsel-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ozellik-sekme-gorsel-dugme:hover { transform: translateY(-2px); }
  .modulex-ozellik-sekme-gorsel-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ozellik-sekme-gorsel-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ozellik-sekme-gorsel-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ozellik-sekme-gorsel-duzen { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.4fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
  .modulex-ozellik-sekme-gorsel-sekmeler { display: grid; gap: 8px; }
  .modulex-ozellik-sekme-gorsel:not(.modulex-ozellik-sekme-gorsel--js) .modulex-ozellik-sekme-gorsel-sekmeler { display: none; }
  .modulex-ozellik-sekme-gorsel:not(.modulex-ozellik-sekme-gorsel--js) .modulex-ozellik-sekme-gorsel-duzen { grid-template-columns: minmax(0, 1fr); }
  .modulex-ozellik-sekme-gorsel-sekme { position: relative; display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --bg--; color: --text--; font: inherit; font-weight: 700; text-align: start; transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease; }
  .modulex-ozellik-sekme-gorsel-sekme:hover { border-color: --accent--; }
  .modulex-ozellik-sekme-gorsel-sekme[aria-selected="true"] { border-color: --accent--; background-color: --accent--; color: --accentText--; }
  .modulex-ozellik-sekme-gorsel-sikon { font-size: 24px; }
  .modulex-ozellik-sekme-gorsel-paneller { display: grid; gap: 28px; }
  .modulex-ozellik-sekme-gorsel-panel { display: grid; gap: 22px; padding: clamp(18px, 2.5vw, 28px); border-radius: calc(--yuvarlak-- * 1.3); background: --kartBg--; animation: modulex-ozellik-sekme-gorsel-gel 0.45s ease both; }
  .modulex-ozellik-sekme-gorsel-gorsel { width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; border-radius: --yuvarlak--; }
  .modulex-ozellik-sekme-gorsel-yazi { display: grid; gap: 10px; }
  .modulex-ozellik-sekme-gorsel-kbaslik { font-size: clamp(1.3rem, 2.4vw, 1.7rem); font-weight: 750; }
  .modulex-ozellik-sekme-gorsel-kmetin { color: --muted--; font-size: 1.02rem; line-height: 1.75; }
  @keyframes modulex-ozellik-sekme-gorsel-gel { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-ozellik-sekme-gorsel-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-ozellik-sekme-gorsel-sekmeler { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .modulex-ozellik-sekme-gorsel-sekme { flex: none; padding: 12px 14px; }
  }
  .modulex-ozellik-sekme-gorsel-git { display: inline-flex; align-items: center; gap: 6px; width: fit-content; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.25s ease; }
  .modulex-ozellik-sekme-gorsel-git:hover { gap: 10px; }
  .modulex-ozellik-sekme-gorsel-git .material-symbols-outlined { font-size: 18px; }
  .modulex-ozellik-sekme-gorsel-ic > .modulex-ozellik-sekme-gorsel-cta { grid-column: 1 / -1; margin-block-start: 32px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ozellik-sekme-gorsel :is(.modulex-ozellik-sekme-gorsel-baslik, .modulex-ozellik-sekme-gorsel-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ozellik-sekme-gorsel-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ozellik-sekme-gorsel { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ozellik-sekme-gorsel *, .modulex-ozellik-sekme-gorsel *::before, .modulex-ozellik-sekme-gorsel *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ozellik-sekme-gorsel";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
