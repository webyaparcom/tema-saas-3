<style>
  /* sayac-brutal — Neo-brutalist görsel dil: yumuşak gölge ve yuvarlak köşe yok; kaba, yüksek kontrastlı ve oyunbaz. */
  .modulex-sayac-brutal { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-brutal *, .modulex-sayac-brutal *::before, .modulex-sayac-brutal *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-brutal :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-brutal :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-brutal :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-brutal :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-brutal img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-brutal) img { height: auto; }

  .modulex-sayac-brutal-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }

  .modulex-sayac-brutal-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-brutal-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-brutal-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }

  .modulex-sayac-brutal-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-brutal-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 26px 22px; }
  .modulex-sayac-brutal-kutu { position: relative; display: grid; align-content: start; gap: 10px; padding: 34px 24px 24px; border: 3px solid --text--; border-radius: --yuvarlak--; background: --bg--; box-shadow: 0 10px 0 --text--; transition: transform 0.18s ease, box-shadow 0.18s ease; }
  .modulex-sayac-brutal-kutu:hover { transform: translateY(10px); box-shadow: 0 0 0 --text--; }
  .modulex-sayac-brutal-cikartma { position: absolute; inset-block-start: -16px; inset-inline-start: 16px; max-width: calc(100% - 32px); padding: 6px 12px; border: 3px solid --text--; font-size: 0.82rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; transform: rotate(-3deg); }

  .modulex-sayac-brutal-sayi { font-size: clamp(2.8rem, 5vw, 4rem); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-brutal :is(.modulex-sayac-brutal-baslik, .modulex-sayac-brutal-ust, h3, h4, strong) { letter-spacing: 0; }

  @media (max-width: 768px) {
    .modulex-sayac-brutal { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-brutal *, .modulex-sayac-brutal *::before, .modulex-sayac-brutal *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-brutal";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sayac(s, P, az);
    });
  })();
</script>
