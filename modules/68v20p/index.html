<section class="modulex-surec-yol-haritasi{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-surec-yol-haritasi-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* surec-yol-haritasi — Adımlar düz bir sırada değil, yolun iki yanına zikzak dağılır (yol/rota metaforu); numaralar yol üstündeki durak pulları. */
  .modulex-surec-yol-haritasi { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-surec-yol-haritasi *, .modulex-surec-yol-haritasi *::before, .modulex-surec-yol-haritasi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-surec-yol-haritasi :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-surec-yol-haritasi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-surec-yol-haritasi :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-surec-yol-haritasi :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-surec-yol-haritasi img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-surec-yol-haritasi) img { height: auto; }
  .modulex-surec-yol-haritasi [hidden] { display: none !important; }
  .modulex-surec-yol-haritasi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-surec-yol-haritasi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-surec-yol-haritasi-ic { max-width: --max--; margin-inline: auto; }
  .modulex-surec-yol-haritasi-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-surec-yol-haritasi--bassiz .modulex-surec-yol-haritasi-bas { display: none; }
  .modulex-surec-yol-haritasi-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-surec-yol-haritasi-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-surec-yol-haritasi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-surec-yol-haritasi-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-surec-yol-haritasi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-surec-yol-haritasi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-surec-yol-haritasi-dugme:hover { transform: translateY(-2px); }
  .modulex-surec-yol-haritasi-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-surec-yol-haritasi-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-surec-yol-haritasi-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-surec-yol-haritasi-yol { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 18px; }
  .modulex-surec-yol-haritasi-yol::before { content: ""; position: absolute; inset-inline: 0; inset-block-start: 50%; height: 4px; margin-block-start: -2px; border-radius: 4px; background-color: transparent; background-image: repeating-linear-gradient(90deg, --accent-- 0 18px, transparent 18px 30px); }
  .modulex-surec-yol-haritasi-durak { position: relative; display: grid; grid-template-rows: minmax(150px, 1fr) 56px minmax(150px, 1fr); justify-items: center; text-align: center; }
  .modulex-surec-yol-haritasi-isaret { grid-row: 2; z-index: 1; display: grid; place-items: center; width: 56px; height: 56px; border: 4px solid --bg--; border-radius: 50%; background: --accent--; color: --accentText--; font-weight: 800; font-variant-numeric: tabular-nums; transition: transform 0.3s ease; }
  .modulex-surec-yol-haritasi-ikon { font-size: 24px; }
  .modulex-surec-yol-haritasi-durak:hover .modulex-surec-yol-haritasi-isaret { transform: scale(1.12); }
  .modulex-surec-yol-haritasi-icerik { position: relative; grid-row: 1; align-self: end; display: grid; justify-items: center; gap: 6px; width: 100%; padding: 18px; border-radius: --yuvarlak--; background: --kartBg--; transition: opacity 0.6s ease, transform 0.6s ease; }
  .modulex-surec-yol-haritasi-durak:nth-child(even) .modulex-surec-yol-haritasi-icerik { grid-row: 3; align-self: start; }
  .modulex-surec-yol-haritasi--hazir:not(.modulex-surec-yol-haritasi--gor) .modulex-surec-yol-haritasi-icerik { opacity: 0; transform: translateY(14px); }
  .modulex-surec-yol-haritasi-kbaslik { font-size: 1.08rem; font-weight: 750; }
  .modulex-surec-yol-haritasi-kmetin { color: --muted--; font-size: 0.92rem; }
  .modulex-surec-yol-haritasi-icerik .modulex-surec-yol-haritasi-sure { justify-self: center; }
  @media (max-width: 768px) {
    .modulex-surec-yol-haritasi-yol { grid-auto-flow: row; gap: 14px; }
    .modulex-surec-yol-haritasi-yol::before { inset-block: 0; inset-inline: 26px auto; width: 4px; height: auto; margin: 0; background-image: repeating-linear-gradient(180deg, --accent-- 0 18px, transparent 18px 30px); }
    .modulex-surec-yol-haritasi-durak { grid-template-rows: auto; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; justify-items: stretch; text-align: start; }
    .modulex-surec-yol-haritasi-isaret { grid-row: 1; grid-column: 1; }
    .modulex-surec-yol-haritasi-icerik, .modulex-surec-yol-haritasi-durak:nth-child(even) .modulex-surec-yol-haritasi-icerik { grid-row: 1; grid-column: 2; align-self: start; justify-items: start; }
    .modulex-surec-yol-haritasi-icerik .modulex-surec-yol-haritasi-sure { justify-self: start; }
  }
  .modulex-surec-yol-haritasi-sure { display: inline-flex; align-items: center; gap: 6px; justify-self: start; width: fit-content; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, --accent-- 12%, transparent); color: --text--; font-size: 0.85rem; font-weight: 600; }
  .modulex-surec-yol-haritasi-sure .material-symbols-outlined { font-size: 18px; color: --accentInk--; }
  .modulex-surec-yol-haritasi-etiket { color: --accentInk--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }

  .modulex-surec-yol-haritasi-bag { color: inherit; text-decoration: none; }
  .modulex-surec-yol-haritasi-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-surec-yol-haritasi-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-surec-yol-haritasi :is(.modulex-surec-yol-haritasi-baslik, .modulex-surec-yol-haritasi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-surec-yol-haritasi-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-surec-yol-haritasi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-surec-yol-haritasi *, .modulex-surec-yol-haritasi *::before, .modulex-surec-yol-haritasi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-surec-yol-haritasi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
